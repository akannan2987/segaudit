# ---------------------------------------------------------------------------
# configs/quick.yaml — a deliberately tiny configuration.
#
# Purpose: prove the whole pipeline runs end to end in a couple of minutes on
# any laptop, and give the automated tests and the CI runners something fast
# to execute. It uses the synthetic phantom generator, so no download is
# needed. Numbers here are NOT meant to give good models — they are meant to
# give *fast* ones.
# ---------------------------------------------------------------------------

track: radiology

project:
  name: segaudit
  run_label: quick

paths:
  data_raw: data/raw
  data_processed: data/processed
  outputs: outputs/quick          # kept apart from real runs
  models: models/quick

data:
  source: synthetic_phantom
  use_synthetic: true
  msd:
    url: https://msd-for-monai.s3-us-west-2.amazonaws.com/Task04_Hippocampus.tar
    md5: 9d24dba78a72977dbd1d2e110310f31b
    archive: Task04_Hippocampus.tar
    dirname: Task04_Hippocampus
  synthetic:
    n_cases: 6
    shape: [32, 40, 32]
    voxel_size_mm: [1.0, 1.0, 1.0]

qa:
  spacing_min_mm: 0.2
  spacing_max_mm: 5.0
  min_shape: 8
  max_shape: 1024
  allowed_labels: [0, 1, 2]
  min_foreground_voxels: 10

pathology:
  mpp: 0.5
  tile_size: 128
  magnification: 20
  synthetic:
    n_slides: 2
    tiles_per_slide: 4
    grid: 2
    tile_size: 128
    mpp: 0.5
    magnification: 20
    patterns: [clustered, infiltrating]

reproducibility:
  seed: 7

storage:
  backend: local_parquet

training:
  epochs: 2
  batch_size: 2
  learning_rate: 0.001

uncertainty:
  tta_passes: 2
  mc_dropout_passes: 4

quality_control:
  failure_dice_threshold: 0.80
  review_budget_fraction: 0.25
