<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 320" role="img" aria-label="Dice measures how much two outlines overlap: twice the shared area divided by the sum of both areas. Examples show Dice 1.0 for identical outlines, about 0.7 for partial overlap, and 0.0 for none." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="320" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2328">Dice = how much two outlines agree</text>

  <!-- Main picture: two overlapping ellipses -->
  <g>
    <ellipse cx="230" cy="150" rx="95" ry="62" fill="#1f6feb" fill-opacity="0.25" stroke="#1f6feb" stroke-width="2"/>
    <ellipse cx="310" cy="165" rx="95" ry="62" fill="#fb8500" fill-opacity="0.30" stroke="#bc4c00" stroke-width="2"/>
    <text x="165" y="92" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f6feb">expert's outline</text>
    <text x="330" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#bc4c00">model's outline</text>
    <text x="270" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#1f2328">overlap</text>
  </g>
  <text x="500" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2328">Dice =</text>
  <text x="620" y="138" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">2 &#215; overlap</text>
  <line x1="555" y1="147" x2="685" y2="147" stroke="#1f2328" stroke-width="1.5"/>
  <text x="620" y="166" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">both areas added</text>

  <!-- Three mini examples -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
    <ellipse cx="180" cy="272" rx="34" ry="22" fill="#1f6feb" fill-opacity="0.25" stroke="#1f6feb"/>
    <ellipse cx="182" cy="272" rx="34" ry="22" fill="#fb8500" fill-opacity="0.30" stroke="#bc4c00"/>
    <text x="240" y="277" fill="#1a7f37" font-weight="600">1.0 identical</text>

    <ellipse cx="420" cy="272" rx="34" ry="22" fill="#1f6feb" fill-opacity="0.25" stroke="#1f6feb"/>
    <ellipse cx="452" cy="272" rx="34" ry="22" fill="#fb8500" fill-opacity="0.30" stroke="#bc4c00"/>
    <text x="505" y="277" fill="#9a6700" font-weight="600">&#8776; 0.7 partial</text>

    <ellipse cx="672" cy="272" rx="30" ry="20" fill="#1f6feb" fill-opacity="0.25" stroke="#1f6feb"/>
    <ellipse cx="748" cy="272" rx="30" ry="20" fill="#fb8500" fill-opacity="0.30" stroke="#bc4c00"/>
    <text x="712" y="240" text-anchor="middle" fill="#cf222e" font-weight="600">0.0 no overlap</text>
  </g>
</svg>
