<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="A strip of dots showing per-case Dice scores. Most cases cluster between 0.85 and 0.95, near the mean of 0.91, but a handful of red dots sit far left between 0.3 and 0.55 - the failed cases the average hides." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2328">&#8220;Mean Dice 0.91&#8221; &#8212; and what it hides</text>

  <!-- axis -->
  <line x1="80" y1="200" x2="800" y2="200" stroke="#57606a" stroke-width="1.5"/>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a" text-anchor="middle">
    <text x="80"  y="222">0.0</text><line x1="80"  y1="196" x2="80"  y2="204" stroke="#57606a"/>
    <text x="224" y="222">0.2</text><line x1="224" y1="196" x2="224" y2="204" stroke="#57606a"/>
    <text x="368" y="222">0.4</text><line x1="368" y1="196" x2="368" y2="204" stroke="#57606a"/>
    <text x="512" y="222">0.6</text><line x1="512" y1="196" x2="512" y2="204" stroke="#57606a"/>
    <text x="656" y="222">0.8</text><line x1="656" y1="196" x2="656" y2="204" stroke="#57606a"/>
    <text x="800" y="222">1.0</text><line x1="800" y1="196" x2="800" y2="204" stroke="#57606a"/>
    <text x="440" y="248">Dice score per case (one dot = one patient's scan)</text>
  </g>

  <!-- healthy cluster: dots 0.82-0.97, jittered rows -->
  <g fill="#1a7f37" fill-opacity="0.75">
    <circle cx="672" cy="188" r="6"/><circle cx="684" cy="172" r="6"/><circle cx="695" cy="188" r="6"/>
    <circle cx="702" cy="156" r="6"/><circle cx="710" cy="184" r="6"/><circle cx="716" cy="168" r="6"/>
    <circle cx="722" cy="188" r="6"/><circle cx="728" cy="152" r="6"/><circle cx="734" cy="176" r="6"/>
    <circle cx="740" cy="188" r="6"/><circle cx="744" cy="160" r="6"/><circle cx="750" cy="184" r="6"/>
    <circle cx="756" cy="170" r="6"/><circle cx="762" cy="188" r="6"/><circle cx="768" cy="156" r="6"/>
    <circle cx="774" cy="180" r="6"/><circle cx="780" cy="168" r="6"/><circle cx="786" cy="188" r="6"/>
  </g>

  <!-- failures -->
  <g fill="#cf222e">
    <circle cx="310" cy="188" r="7"/><circle cx="356" cy="188" r="7"/><circle cx="418" cy="188" r="7"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <path d="M 364 120 Q 364 158 360 176" stroke="#cf222e" fill="none" stroke-width="1.5"/>
    <text x="364" y="106" text-anchor="middle" font-size="14" font-weight="600" fill="#cf222e">the failures the mean hides &#8212;</text>
    <text x="364" y="124" text-anchor="middle" font-size="13" fill="#cf222e">and, on new scans, nobody can compute this score at all</text>
  </g>

  <!-- mean line -->
  <line x1="735" y1="70" x2="735" y2="200" stroke="#1f6feb" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="735" y="58" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#1f6feb">mean = 0.91</text>
</svg>
