<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="Quality assurance checks inputs before the pipeline runs, like checking ingredients; quality control judges outputs afterwards, like tasting the dish. Both tracks use the same idea: gates on scans and slides going in, a trust score on segmentations coming out." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2328">QA checks what goes in &#183; QC judges what comes out</text>

  <!-- inputs -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="90" width="150" height="60" rx="8" fill="#dbeafe" stroke="#1f6feb"/>
    <text x="115" y="115" text-anchor="middle" font-size="13" fill="#1f2328">scan (NIfTI)</text>
    <text x="115" y="135" text-anchor="middle" font-size="11" fill="#57606a">spacing &#183; orientation &#183; labels</text>
    <rect x="40" y="165" width="150" height="60" rx="8" fill="#fce7f3" stroke="#bf3989"/>
    <text x="115" y="190" text-anchor="middle" font-size="13" fill="#1f2328">slide (WSI)</text>
    <text x="115" y="210" text-anchor="middle" font-size="11" fill="#57606a">mpp &#183; magnification &#183; artefacts</text>
  </g>
  <line x1="190" y1="157" x2="240" y2="157" stroke="#57606a" stroke-width="2"/><polygon points="240,152 250,157 240,162" fill="#57606a"/>

  <!-- QA gate -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="252" y="95" width="150" height="125" rx="8" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
    <text x="327" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#9a6700">QA gate</text>
    <text x="327" y="142" text-anchor="middle" font-size="11" fill="#1f2328">is this even a sane input?</text>
    <text x="327" y="162" text-anchor="middle" font-size="11" fill="#57606a">refuse &#8594; qa_issues table</text>
    <text x="327" y="182" text-anchor="middle" font-size="11" fill="#57606a">pass &#8594; continue</text>
    <text x="327" y="206" text-anchor="middle" font-size="11" font-style="italic" fill="#9a6700">checking the ingredients</text>
  </g>
  <line x1="402" y1="157" x2="452" y2="157" stroke="#57606a" stroke-width="2"/><polygon points="452,152 462,157 452,162" fill="#57606a"/>

  <!-- pipeline -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="464" y="120" width="120" height="75" rx="8" fill="#f6f8fa" stroke="#57606a"/>
    <text x="524" y="150" text-anchor="middle" font-size="13" fill="#1f2328">segment</text>
    <text x="524" y="170" text-anchor="middle" font-size="11" fill="#57606a">model or import</text>
  </g>
  <line x1="584" y1="157" x2="634" y2="157" stroke="#57606a" stroke-width="2"/><polygon points="634,152 644,157 634,162" fill="#57606a"/>

  <!-- QC -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="646" y="95" width="180" height="125" rx="8" fill="#dcfce7" stroke="#1a7f37" stroke-width="2"/>
    <text x="736" y="120" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">QC score</text>
    <text x="736" y="142" text-anchor="middle" font-size="11" fill="#1f2328">can this outline be trusted?</text>
    <text x="736" y="162" text-anchor="middle" font-size="11" fill="#57606a">review &#8594; triage queue</text>
    <text x="736" y="182" text-anchor="middle" font-size="11" fill="#57606a">auto-accept &#8594; biomarker</text>
    <text x="736" y="206" text-anchor="middle" font-size="11" font-style="italic" fill="#1a7f37">tasting the dish</text>
  </g>
  <text x="430" y="262" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Phase 1 / P1 build the gate on the left; Phases 5–6 / P5 build the score on the right. Same shape, both tracks.</text>
</svg>
