<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" role="img" aria-label="Two input doors, radiology (3D scans) and pathology (2D slides), feed one shared core: uncertainty, quality control, triage, repeatability, biomarker tables, storage, review app and agent tools. Track-specific code lives in two side packages; shared code lives once in the middle." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="330" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2328">Two doors, one core</text>

  <!-- Track R door -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="40" y="70" width="230" height="150" rx="10" fill="#dbeafe" stroke="#1f6feb" stroke-width="2"/>
    <text x="155" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1f6feb">Track R &#183; radiology</text>
    <text x="155" y="118" text-anchor="middle" font-size="13" fill="#1f2328">3D scans (MRI now; CT, PET later)</text>
    <text x="155" y="142" text-anchor="middle" font-size="12" fill="#57606a">NIfTI / DICOM &#183; voxel spacing</text>
    <text x="155" y="160" text-anchor="middle" font-size="12" fill="#57606a">MRI phantom &#183; 3D U-Net</text>
    <text x="155" y="178" text-anchor="middle" font-size="12" fill="#57606a">unit = case</text>
    <text x="155" y="205" text-anchor="middle" font-size="12" font-family="monospace" fill="#1f6feb">segaudit/radiology/</text>
  </g>

  <!-- Track P door -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="590" y="70" width="230" height="150" rx="10" fill="#fce7f3" stroke="#bf3989" stroke-width="2"/>
    <text x="705" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#bf3989">Track P &#183; pathology</text>
    <text x="705" y="118" text-anchor="middle" font-size="13" fill="#1f2328">2D slides (H&amp;E, IHC, mIF, spatial)</text>
    <text x="705" y="142" text-anchor="middle" font-size="12" fill="#57606a">WSI / tiles &#183; microns per pixel</text>
    <text x="705" y="160" text-anchor="middle" font-size="12" fill="#57606a">synthetic tiles &#183; nuclei &amp; tissue models</text>
    <text x="705" y="178" text-anchor="middle" font-size="12" fill="#57606a">unit = tile &#8594; slide</text>
    <text x="705" y="205" text-anchor="middle" font-size="12" font-family="monospace" fill="#bf3989">segaudit/pathology/</text>
  </g>

  <!-- arrows into core -->
  <line x1="270" y1="145" x2="318" y2="145" stroke="#57606a" stroke-width="2"/>
  <polygon points="318,140 328,145 318,150" fill="#57606a"/>
  <line x1="590" y1="145" x2="542" y2="145" stroke="#57606a" stroke-width="2"/>
  <polygon points="542,140 532,145 542,150" fill="#57606a"/>

  <!-- shared core -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="330" y="70" width="200" height="230" rx="10" fill="#dcfce7" stroke="#1a7f37" stroke-width="2"/>
    <text x="430" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#1a7f37">Shared core &#183; built once</text>
    <text x="430" y="122" text-anchor="middle" font-size="12" fill="#1f2328">uncertainty (TTA, MC dropout)</text>
    <text x="430" y="142" text-anchor="middle" font-size="12" fill="#1f2328">reference-free QC score</text>
    <text x="430" y="162" text-anchor="middle" font-size="12" fill="#1f2328">triage queue + operating point</text>
    <text x="430" y="182" text-anchor="middle" font-size="12" fill="#1f2328">repeatability &#183; min. detectable diff.</text>
    <text x="430" y="202" text-anchor="middle" font-size="12" fill="#1f2328">biomarker table with CIs</text>
    <text x="430" y="222" text-anchor="middle" font-size="12" fill="#1f2328">benchmark harness</text>
    <text x="430" y="242" text-anchor="middle" font-size="12" fill="#1f2328">storage &#183; review app &#183; agent tools</text>
    <text x="430" y="262" text-anchor="middle" font-size="12" fill="#1f2328">container</text>
    <text x="430" y="288" text-anchor="middle" font-size="12" font-family="monospace" fill="#1a7f37">segaudit/*.py</text>
  </g>

  <text x="430" y="318" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">A shared component counts as finished only when it is demonstrated on both tracks.</text>
</svg>
