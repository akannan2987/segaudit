<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="A 3D scan is a volume, sliced like a loaf of bread; each slice is a grid of squares, and stacking slices makes tiny cubes called voxels." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2328">One scan = a volume = a loaf of slices = a stack of voxels</text>

  <!-- Panel 1: the volume (a 3D box) -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <polygon points="60,110 180,110 210,85 90,85" fill="#dbeafe" stroke="#1f6feb"/>
    <polygon points="180,110 210,85 210,195 180,220" fill="#b6d4fe" stroke="#1f6feb"/>
    <rect x="60" y="110" width="120" height="110" fill="#eaf2ff" stroke="#1f6feb"/>
    <text x="135" y="252" text-anchor="middle" font-size="15" fill="#1f2328">the volume</text>
    <text x="135" y="272" text-anchor="middle" font-size="13" fill="#57606a">one 3D picture of the head</text>
  </g>

  <text x="270" y="165" text-anchor="middle" font-size="26" fill="#57606a">&#8594;</text>

  <!-- Panel 2: the slices (loaf) -->
  <g>
    <g stroke="#8250df" fill="#f3ebff">
      <polygon points="320,120 360,95 360,205 320,230"/>
      <polygon points="345,120 385,95 385,205 345,230" fill="#efe3ff"/>
      <polygon points="370,120 410,95 410,205 370,230" fill="#f3ebff"/>
      <polygon points="395,120 435,95 435,205 395,230" fill="#efe3ff"/>
      <polygon points="420,120 460,95 460,205 420,230" fill="#f3ebff"/>
    </g>
    <text x="390" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">the slices</text>
    <text x="390" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">a loaf of thin 2D images</text>
  </g>

  <text x="510" y="165" text-anchor="middle" font-size="26" fill="#57606a">&#8594;</text>

  <!-- Panel 3: one slice as a grid, one voxel highlighted -->
  <g>
    <g stroke="#d0d7de" fill="#ffffff">
      <rect x="560" y="95" width="180" height="135"/>
    </g>
    <g stroke="#d0d7de">
      <line x1="590" y1="95" x2="590" y2="230"/><line x1="620" y1="95" x2="620" y2="230"/>
      <line x1="650" y1="95" x2="650" y2="230"/><line x1="680" y1="95" x2="680" y2="230"/>
      <line x1="710" y1="95" x2="710" y2="230"/>
      <line x1="560" y1="122" x2="740" y2="122"/><line x1="560" y1="149" x2="740" y2="149"/>
      <line x1="560" y1="176" x2="740" y2="176"/><line x1="560" y1="203" x2="740" y2="203"/>
    </g>
    <!-- a faint structure -->
    <g fill="#fff1e5">
      <rect x="620" y="122" width="30" height="27"/><rect x="650" y="122" width="30" height="27"/>
      <rect x="620" y="149" width="30" height="27"/><rect x="650" y="149" width="30" height="27"/>
      <rect x="680" y="149" width="30" height="27"/>
    </g>
    <!-- the voxel -->
    <rect x="650" y="149" width="30" height="27" fill="#fb8500" stroke="#953800"/>
    <line x1="695" y1="128" x2="668" y2="152" stroke="#953800" stroke-width="1.5"/>
    <text x="700" y="124" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#953800">one voxel</text>
    <text x="650" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328">one slice, up close</text>
    <text x="650" y="272" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">a grid of tiny cubes (3D pixels)</text>
  </g>
</svg>
