<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-label="A whole-slide image is a gigapixel photograph of a glass slide stored as a pyramid of zoom levels; a tile is a small square cut from one level; microns per pixel is the scale bar that turns pixels into real distances." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="300" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2328">One slide = a gigapixel image = a pyramid of zoom levels = a grid of tiles</text>

  <!-- Panel 1: glass slide with tissue -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="50" y="105" width="170" height="70" rx="4" fill="#f6f8fa" stroke="#57606a"/>
    <rect x="60" y="112" width="24" height="56" fill="#d0d7de"/>
    <path d="M110,140 C120,112 165,108 190,125 C205,136 200,160 178,166 C150,174 118,170 110,140 Z" fill="#e6b0c7" stroke="#b76e9a"/>
    <path d="M128,140 C138,126 160,124 172,134 C180,142 174,154 160,157 C144,160 130,154 128,140 Z" fill="#8f5aa8" fill-opacity="0.55"/>
    <text x="135" y="212" text-anchor="middle" font-size="15" fill="#1f2328">the glass slide</text>
    <text x="135" y="232" text-anchor="middle" font-size="13" fill="#57606a">stained tissue, scanned</text>
  </g>
  <text x="255" y="150" text-anchor="middle" font-size="26" fill="#57606a">&#8594;</text>

  <!-- Panel 2: pyramid of levels -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="300" y="160" width="190" height="60" fill="#dbeafe" stroke="#1f6feb"/>
    <rect x="330" y="128" width="130" height="32" fill="#c3d9fb" stroke="#1f6feb"/>
    <rect x="355" y="106" width="80" height="22" fill="#a8c7f7" stroke="#1f6feb"/>
    <rect x="375" y="92" width="40" height="14" fill="#8fb6f3" stroke="#1f6feb"/>
    <text x="500" y="196" font-size="12" fill="#1f6feb">level 0 &#183; full resolution</text>
    <text x="466" y="148" font-size="12" fill="#1f6feb">level 1 &#183; half</text>
    <text x="440" y="121" font-size="12" fill="#1f6feb">level 2</text>
    <text x="395" y="240" text-anchor="middle" font-size="15" fill="#1f2328">the pyramid</text>
    <text x="395" y="260" text-anchor="middle" font-size="13" fill="#57606a">read any rectangle at any zoom</text>
  </g>
  <text x="560" y="150" text-anchor="middle" font-size="26" fill="#57606a">&#8594;</text>

  <!-- Panel 3: tile grid with one tile and a scale bar -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="600" y="92" width="180" height="128" fill="#ffffff" stroke="#d0d7de"/>
    <g stroke="#d0d7de">
      <line x1="645" y1="92" x2="645" y2="220"/><line x1="690" y1="92" x2="690" y2="220"/><line x1="735" y1="92" x2="735" y2="220"/>
      <line x1="600" y1="124" x2="780" y2="124"/><line x1="600" y1="156" x2="780" y2="156"/><line x1="600" y1="188" x2="780" y2="188"/>
    </g>
    <rect x="645" y="124" width="45" height="32" fill="#fb8500" fill-opacity="0.85" stroke="#953800"/>
    <circle cx="655" cy="134" r="3" fill="#48286e"/><circle cx="672" cy="146" r="3" fill="#48286e"/><circle cx="682" cy="131" r="2.5" fill="#48286e"/>
    <line x1="700" y1="112" x2="678" y2="127" stroke="#953800" stroke-width="1.5"/>
    <text x="704" y="110" font-size="13" fill="#953800">one tile</text>
    <!-- scale bar -->
    <line x1="612" y1="210" x2="642" y2="210" stroke="#1f2328" stroke-width="2"/>
    <text x="627" y="205" text-anchor="middle" font-size="10" fill="#1f2328">mpp</text>
    <text x="690" y="240" text-anchor="middle" font-size="15" fill="#1f2328">tiles, up close</text>
    <text x="690" y="260" text-anchor="middle" font-size="13" fill="#57606a">mpp = microns per pixel, the scale bar</text>
  </g>
</svg>
