<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 280" role="img" aria-label="One computer with two separate sealed toolboxes: SegAudit's .venv containing numpy 1.26 and torch 2.2, and another project's .venv containing numpy 2.4. Each project uses only its own toolbox, so versions never clash." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="860" height="280" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="430" y="34" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#1f2328">A virtual environment = a sealed toolbox per project</text>

  <!-- the computer -->
  <rect x="60" y="70" width="740" height="150" rx="10" fill="#f6f8fa" stroke="#57606a"/>
  <text x="90" y="98" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">your one computer</text>

  <!-- toolbox 1 -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="110" y="110" width="290" height="88" rx="8" fill="#dbeafe" stroke="#1f6feb" stroke-width="2"/>
    <rect x="110" y="110" width="290" height="26" rx="8" fill="#1f6feb"/>
    <text x="255" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">segaudit/.venv</text>
    <text x="255" y="158" text-anchor="middle" font-size="13" fill="#1f2328">numpy 1.26 &#183; torch 2.2 &#183; monai 1.4 &#8230;</text>
    <text x="255" y="180" text-anchor="middle" font-size="13" fill="#57606a">used only when activated here</text>
  </g>

  <!-- toolbox 2 -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <rect x="460" y="110" width="290" height="88" rx="8" fill="#f3ebff" stroke="#8250df" stroke-width="2"/>
    <rect x="460" y="110" width="290" height="26" rx="8" fill="#8250df"/>
    <text x="605" y="128" text-anchor="middle" font-size="14" font-weight="600" fill="#ffffff">other-project/.venv</text>
    <text x="605" y="158" text-anchor="middle" font-size="13" fill="#1f2328">numpy 2.4 &#183; different packages &#8230;</text>
    <text x="605" y="180" text-anchor="middle" font-size="13" fill="#57606a">never touched by SegAudit</text>
  </g>

  <!-- no-clash symbol -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <line x1="415" y1="140" x2="445" y2="170" stroke="#cf222e" stroke-width="3"/>
    <line x1="445" y1="140" x2="415" y2="170" stroke="#cf222e" stroke-width="3"/>
  </g>
  <text x="430" y="252" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328">Sealed boxes: two projects can need different versions and both stay happy. Delete a box = clean reset, nothing else affected.</text>
</svg>
